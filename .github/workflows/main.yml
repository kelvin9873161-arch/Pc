name: RDP-MV

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 3600

    steps:
      - name: Enable Hyper-V and Virtualization Features
        run: |
          Write-Host "Instalando recursos de Máquina Virtual (Hyper-V)..."
          Install-WindowsFeature -Name Hyper-V, Containers, RSAT-Hyper-V-Tools -IncludeAllSubFeature -ErrorAction SilentlyContinue
          Write-Host "Recursos de virtualização configurados!"

      - name: Optimize Windows Performance
        run: |
          Write-Host "Otimizando o Windows para melhor desempenho no PC Virtual..."
          
          # 1. Configurar efeitos visuais para 'Melhor Desempenho'
          $VisualFXPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects"
          if (-not (Test-Path $VisualFXPath)) { New-Item $VisualFXPath -Force | Out-Null }
          Set-ItemProperty -Path $VisualFXPath -Name "VisualFXSetting" -Value 2 -Force

          # 2. Declarando o array de bytes de forma compatível
          [byte[]]$UserPrefsMask = @(144,18,3,128,16,0,0,0)
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name "UserPreferencesMask" -Value $UserPrefsMask -Force
          
          # Outros ajustes visuais
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name "FontSmoothing" -Value 0 -Force
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name "DragFullWindows" -Value 0 -Force
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop\WindowMetrics' -Name "MinAnimate" -Value 0 -Force

          # 3. Alterar o plano de energia para 'Alto Desempenho'
          powercfg /setactive 8c59c45d-4bf1-4cc4-861c-70de9a02885c

          # 4. Desativar o Windows Defender em tempo real temporariamente
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue

          # 5. Otimizações de rede no registro
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters' -Name "Size" -Value 3 -Force
          
          # 6. Desativar hibernação
          powercfg /h off

          Write-Host "Otimizações de performance aplicadas com sucesso!"

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "Skyro" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "Skyro"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Skyro"
          
          echo "RDP_CREDS=User: Skyro | Password: $password" >> $env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name "Skyro")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          # Busca automaticamente a URL da versão estável mais recente (.msi) para evitar links quebrados
          $installerPath = "$env:TEMP\tailscale.msi"
          $tsUrl = "https://tailscale.com"
          
          Write-Host "Baixando o Tailscale de: $tsUrl"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          
          Write-Host "Instalando o Tailscale de forma silenciosa..."
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          # Inicializa o Tailscale usando o caminho padrão de instalação do Windows
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 12) {
              $tsIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
              if (-not $tsIP) {
                  Start-Sleep -Seconds 5
                  $retries++
              }
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP não foi atribuído a tempo. Verifique sua chave de autenticação."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP obtido: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "A conexão TCP para a porta RDP 3389 falhou."
              exit 1
          }
          Write-Host "Porta RDP aberta e respondendo via Tailscale!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== INFORMAÇÕES DE ACESSO AO RDP ==="
          Write-Host "Endereço IP: $env:TAILSCALE_IP"
          Write-Host "Usuário: Skyro"
          Write-Host "Credenciais geradas: $(echo $env:RDP_CREDS)"
          Write-Host "====================================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Ativo e Otimizado. Cancele o workflow no GitHub para encerrar."
              Start-Sleep -Seconds 300
          }
